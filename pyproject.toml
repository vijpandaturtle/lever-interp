[project]
name = "lever-interp"
version = "0.1.0"
description = "Mechanistic interpretability tooling for foundation models: hooks, lenses, patching and model diffing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.51",
    "accelerate",
    "qwen-vl-utils",
    "pillow",
    "numpy",
    "einops",
    "matplotlib",
    "scikit-learn",
    "sentencepiece",
    "protobuf",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lever"]

[tool.pytest.ini_options]
testpaths = ["tests"]
