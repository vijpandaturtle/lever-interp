site_name: lever
site_description: Mechanistic interpretability tooling for vision-language models, built for safety research
repo_url: https://github.com/vijpandaturtle/lever-interp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - toc.follow
  # Light-only, matching vijpandaturtle.github.io (which has no dark mode).
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# Fail the build on broken links/anchors instead of publishing them.
validation:
  links:
    anchors: warn
